name: Android build

on:
  push:
    branches:
      - feature/hls-recording-button
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository and submodules
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Fetch LibVLC JNI sources required by settings.gradle
        run: |
          if [ ! -d libvlcjni/.git ]; then
            rm -rf libvlcjni
            git clone --depth 1 --branch master https://code.videolan.org/videolan/libvlcjni.git libvlcjni
          else
            echo "LibVLC JNI sources already checked out"
          fi
          test -d libvlcjni/libvlc

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK command-line tools
        uses: android-actions/setup-android@v3
        with:
          packages: ''

      - name: Install required Android SDK packages
        run: |
          SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" -type f -name sdkmanager 2>/dev/null | head -n 1)"
          if [ -z "$SDKMANAGER" ]; then
            echo "sdkmanager was not found under $ANDROID_HOME/cmdline-tools"
            find "$ANDROID_HOME" -maxdepth 4 -type f -name sdkmanager 2>/dev/null || true
            exit 1
          fi
          yes | "$SDKMANAGER" --licenses || true
          # Large SDK downloads can be truncated on hosted runners. Retry and
          # clear partial downloads before each attempt to avoid a corrupt NDK ZIP.
          for attempt in 1 2 3 4; do
            if "$SDKMANAGER" --install "platform-tools" "platforms;android-36" "build-tools;36.0.0" "ndk;28.2.13676358"; then
              echo "Android SDK packages installed successfully on attempt $attempt"
              exit 0
            fi
            echo "::warning::Android SDK installation failed on attempt $attempt"
            rm -rf "$ANDROID_HOME/.temp" "$ANDROID_HOME/.downloadIntermediates" "$ANDROID_HOME/ndk/28.2.13676358"
            if [ "$attempt" -lt 4 ]; then sleep $((attempt * 10)); fi
          done
          echo "::error::Android SDK installation failed after 4 attempts"
          exit 1

      - name: Create local Android SDK configuration
        run: echo "sdk.dir=$ANDROID_HOME" > local.properties

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build VLC Android application APK with LibVLC 4 recording API
        run: gradle -PforceVlc4=true :application:app:assembleDebug --stacktrace

      - name: Locate generated APKs
        if: always()
        run: |
          echo "Searching for generated APK files..."
          find application/app/build/outputs -type f -name "*.apk" -print 2>/dev/null || true
          mkdir -p artifacts
          find application/app/build/outputs -type f -name "*.apk" -exec cp {} artifacts/ \; 2>/dev/null || true
          echo "APK files copied to artifacts/:"
          ls -lah artifacts || true

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: VLC-Android-debug-APK
          path: artifacts/*.apk
          if-no-files-found: error
          retention-days: 7
