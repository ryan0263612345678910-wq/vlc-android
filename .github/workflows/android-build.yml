name: Android build

on:
  push:
    branches:
      - feature/hls-recording-button
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository and submodules
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Fetch LibVLC JNI sources required by settings.gradle
        run: |
          if [ ! -d libvlcjni/.git ]; then
            rm -rf libvlcjni
            git clone --depth 1 --branch libvlcjni-3.x https://code.videolan.org/videolan/libvlcjni.git libvlcjni
          else
            echo "LibVLC JNI sources already checked out"
          fi
          test -d libvlcjni/libvlc

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK command-line tools
        uses: android-actions/setup-android@v3
        with:
          packages: ''

      - name: Install required Android SDK packages
        run: |
          SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" -type f -name sdkmanager 2>/dev/null | head -n 1)"
          if [ -z "$SDKMANAGER" ]; then
            echo "sdkmanager was not found under $ANDROID_HOME/cmdline-tools"
            find "$ANDROID_HOME" -maxdepth 4 -type f -name sdkmanager 2>/dev/null || true
            exit 1
          fi
          yes | "$SDKMANAGER" --licenses || true
          "$SDKMANAGER" --install "platform-tools" "platforms;android-36" "build-tools;36.0.0" "ndk;21.4.7075529"

      - name: Create local Android SDK configuration
        run: echo "sdk.dir=$ANDROID_HOME" > local.properties

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build VLC Android debug variant
        run: gradle :application:vlc-android:assembleDebug --stacktrace

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: VLC-Android-debug-APK
          path: application/vlc-android/build/outputs/apk/**/*.apk
          if-no-files-found: error
          retention-days: 7
